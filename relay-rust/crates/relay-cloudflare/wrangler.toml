name = "windshare-relay-cloudflare"
main = "build/index.js"
workers_dev = true
preview_urls = false
compatibility_date = "2026-10-17"
compatibility_flags = ["web_socket_auto_reply_to_close"]

[build]
command = "worker-build --release --locked"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareRelayObject"]

[[durable_objects.bindings]]
name = "SHARES"
class_name = "ShareRelayObject"

[[previews.durable_objects.bindings]]
name = "SHARES"
class_name = "ShareRelayObject"

[observability]
enabled = true

[previews.observability]
enabled = true

[previews.observability.logs]
enabled = true
invocation_logs = true
persist = true
