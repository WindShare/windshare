[package]
name = "windshare-relay-cloudflare"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Cloudflare Worker and Durable Object lifecycle host for WindShare"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
windshare-relay-core = { path = "../relay-core" }
anyhow = "1"
base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.8.7"
js-sys = "0.3"
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
