[package]
name = "windshare-network-authority"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Official network account, admission and traffic authority"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
windshare-relay-access = { path = "../relay-access" }
anyhow = "1"
base64 = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.8.7"
futures-util = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

[lints]
workspace = true
