[package]
name = "windshare-relay-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native WebSocket and durable lifecycle host for WindShare"

[[bin]]
name = "relay-native"
path = "src/main.rs"

[dependencies]
windshare-relay-core = { path = "../relay-core" }
anyhow = "1"
base64 = "0.23.1"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11.1"
socket2 = "0.6"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.3", features = ["test-util"] }

[lints]
workspace = true
