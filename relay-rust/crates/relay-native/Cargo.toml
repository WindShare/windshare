[package]
name = "windshare-relay-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native WebSocket and durable lifecycle host for WindShare"

[[bin]]
name = "relay-native"
path = "src/main.rs"

[dependencies]
windshare-relay-console = { path = "../../console" }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
windshare-relay-core = { path = "../relay-core" }
windshare-relay-access = { path = "../relay-access" }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
anyhow = "1"
base64 = "0.23.1"
crc32fast = "1"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
sha2 = "0.11.1"
socket2 = "0.6"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.3", features = ["test-util"] }

[lints]
workspace = true
