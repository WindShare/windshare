[package]
name = "windshare-relay-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Transport-independent WindShare relay control semantics"

[dependencies]
windshare-relay-access = { path = "../relay-access" }
ed25519-dalek = { version = "3.0.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }

[dev-dependencies]
base64 = "0.23.1"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
