[workspace]
members = ["crates/relay-access", "crates/relay-core", "crates/relay-native", "crates/relay-cloudflare"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# `#[must_use]` is reserved for obligation types (host actions, effects) where
# dropping the value silently loses work the host must perform. Auto-marking
# every value-returning getter adds a line of noise per accessor without
# catching a realistic mistake, so the pedantic candidate lint stays off.
must_use_candidate = "allow"
cognitive_complexity = "deny"
too_many_lines = "deny"
