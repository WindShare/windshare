# go-test-coverage config for core production packages.
# Non-core packages have their own gate at ../.testcoverage.yml (total >=60).
# https://github.com/vladopajic/go-test-coverage
#
# Core belongs to the root Go module; resolve both profiles from the repository root.

profile: cover.out

threshold:
  # Every package must hold the floor on its own; the group total cannot
  # subsidize an under-tested package.
  package: 50
  # Core package total.
  total: 60
  # No per-file floor.
  file: 0

# Require every coverage-ignore annotation to carry an explanatory comment:
# ```go
# if err != nil { // coverage-ignore
#   return err
# }
# ```
force-annotation-comment: true
