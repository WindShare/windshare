name: Set up Playwright browsers
description: Install browser runtimes with bounded, retryable APT downloads.

inputs:
  browsers:
    description: Space-separated Playwright browser names.
    required: true

runs:
  using: composite
  steps:
    - name: Bound system dependency downloads
      shell: bash
      run: |
        # A stalled mirror must release the job's budget for another download
        # attempt and the browser tests. Playwright invokes APT through sudo.
        sudo tee /etc/apt/apt.conf.d/80windshare-browser >/dev/null <<'APT'
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        Acquire::Retries "3";
        APT
    - name: Install Playwright runtimes and system dependencies
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.browsers }}
      run: |
        read -r -a browsers <<< "$PLAYWRIGHT_BROWSERS"
        pnpm -C web exec playwright install --with-deps "${browsers[@]}"
