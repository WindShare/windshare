name: Set up headless Playwright browsers
description: Install headless browsers and prepare any required system dependencies.

inputs:
  browsers:
    description: Space-separated Playwright browser names.
    required: true

runs:
  using: composite
  steps:
    - name: Set up headless browser runtimes
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.browsers }}
        BROWSER_SETUP_DIRECTORY: ${{ github.action_path }}
      run: |
        read -r -a browsers <<< "$PLAYWRIGHT_BROWSERS"
        bash "$BROWSER_SETUP_DIRECTORY/setup.sh" "${browsers[@]}"
