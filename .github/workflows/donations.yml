name: Donations service

on:
  workflow_dispatch:
  pull_request:
    paths:
      - services/donations/**
      - .github/workflows/donations.yml
  push:
    branches: [main]
    paths:
      - services/donations/**
      - .github/workflows/donations.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.event.pull_request.number && format('donations-pr-{0}', github.event.pull_request.number) || 'donations' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typecheck, and test donations Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: services/donations/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/donations/pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm -C services/donations install --frozen-lockfile
      - name: Run lint, typecheck, unit tests, and Worker bundle dry-run
        run: |
          pnpm -C services/donations check
          pnpm -C services/donations build:check

  deploy:
    needs: verify
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.DONATIONS_DEPLOY_ENABLED == 'true')
    environment: donations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: services/donations/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: services/donations/pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm -C services/donations install --frozen-lockfile
      - name: Deploy windshare-donations Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm -C services/donations deploy
