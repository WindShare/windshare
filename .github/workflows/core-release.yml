name: Core Candidate Release

on:
  push:
    tags:
      - "core-candidate/v*/**"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA to diagnose
        required: true
        type: string
      version:
        description: Core version to diagnose (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  candidate:
    name: Resolve exact candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.candidate.outputs.commit_sha }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify release-ref resolver contract
        run: bash scripts/ci/core-release-ref.tests.sh
      - id: candidate
        name: Bind event to commit and module version
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CREATED: ${{ github.event.created }}
          EVENT_DELETED: ${{ github.event.deleted }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: bash scripts/ci/core-release-ref.sh resolve

  linux-ext4:
    name: Linux ext4 extracted core and process-restart certification
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Per-version lanes serialize competing candidates without making the two
    # platform certifications wait for one another.
    concurrency:
      group: core-release-linux-${{ needs.candidate.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean checkout
        env:
          EXPECTED_SHA: ${{ needs.candidate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Install latest govulncheck
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          mkdir -p "$GOBIN"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Extract and verify Linux/ext4 candidate
        env:
          CORE_RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
          CORE_RELEASE_COMMIT_SHA: ${{ needs.candidate.outputs.commit_sha }}
        run: bash scripts/ci/linux/core-release.sh "$CORE_RELEASE_VERSION" "$CORE_RELEASE_COMMIT_SHA" linux-ext4

  windows-ntfs:
    name: Windows NTFS extracted core and process-restart certification
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 90
    concurrency:
      group: core-release-windows-${{ needs.candidate.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.candidate.outputs.commit_sha }}
        run: |
          $actualSHA = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSHA -cne $env:EXPECTED_SHA) {
              throw "checkout resolved to $actualSHA instead of $env:EXPECTED_SHA"
          }
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) {
              throw "candidate checkout is not clean: $($status -join '; ')"
          }
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Install latest govulncheck
        shell: pwsh
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          New-Item -ItemType Directory -Force -Path $env:GOBIN | Out-Null
          & go install golang.org/x/vuln/cmd/govulncheck@latest
          if ($LASTEXITCODE -ne 0) {
              throw "govulncheck installation exited with code $LASTEXITCODE"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $env:GOBIN -Encoding utf8
      - name: Verify standard-user native gate helper contract
        shell: pwsh
        run: ./scripts/ci/core-release-windows-native.tests.ps1
      - name: Extract and verify Windows/NTFS candidate
        shell: pwsh
        env:
          CORE_RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
          CORE_RELEASE_COMMIT_SHA: ${{ needs.candidate.outputs.commit_sha }}
        run: ./scripts/ci/windows/core-release.ps1 -Version $env:CORE_RELEASE_VERSION -CommitSHA $env:CORE_RELEASE_COMMIT_SHA -NativeProfile windows-ntfs

  publish:
    name: Publish immutable core tag
    if: github.event_name == 'push'
    needs:
      - candidate
      - linux-ext4
      - windows-ntfs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: core-release-publish-${{ needs.candidate.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Create immutable core release tag
        env:
          CORE_RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
          CORE_RELEASE_COMMIT_SHA: ${{ needs.candidate.outputs.commit_sha }}
        run: bash scripts/ci/core-release-ref.sh publish
