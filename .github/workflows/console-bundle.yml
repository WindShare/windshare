name: Verify embedded console
on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP: ${{ inputs.app }}
      EXPECTED_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Verify exact pinned checkout
        if: inputs.ref != ''
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REF"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: consoles/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: consoles/pnpm-lock.yaml
      - run: pnpm -C consoles install --frozen-lockfile
      - name: Typecheck consoles and run bundle verifier tests
        run: |
          pnpm -C consoles typecheck
          pnpm -C consoles test
      - name: Compare every embedded file with a clean rebuild
        run: pnpm -C consoles run verify:dist "$APP"
