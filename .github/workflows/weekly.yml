name: Weekly Product Stability

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 0"

permissions:
  contents: read

# A manual diagnostic rerun supersedes an older run for the same ref without
# coupling any of the independent product suites below.
concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOWORK: "off"

jobs:
  integration-linux:
    name: Integration stability (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Run integration packages
        run: go test -count=1 ./integration/...

  integration-windows:
    name: Integration stability (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Run integration packages
        run: go test -count=1 ./integration/...

  named-go-long:
    name: Named process and catalog long suites (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Run process and relay-cut suites
        run: go test -count=1 ./e2e -run '^TestLong'
      - name: Run catalog scale suites
        run: go test -count=1 ./core/catalog -run '^TestLong'

  durable-output:
    name: Durable output runtime (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Run native durability suites
        run: go test -count=1 ./core/osfs/internal/outputruntime -run '^TestLong'

  durable-output-windows:
    name: Durable output runtime (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Run native durability suites
        run: go test -count=1 ./core/osfs/internal/outputruntime -run '^TestLong'

  browser-progressive:
    name: Progressive catalog browser scenario (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Install Chromium runtime
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: Run progressive catalog paging
        run: pnpm -C web test:browser:progressive

  browser-network:
    name: Direct and TURN relay-cut routes (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Install Chromium runtime
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: Run direct and TURN relay-cut routes
        run: pnpm -C web test:browser:network

  browser-interop:
    name: D1/D2 browser-Pion interop (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Install Chromium runtime
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: Run D1/D2 Pion interop
        run: pnpm -C web test:browser:interop

  cross-browser:
    name: Firefox and WebKit product routes (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Install Firefox and WebKit runtimes
        run: pnpm -C web exec playwright install --with-deps firefox webkit
      - name: Run cross-browser product scenarios
        run: pnpm -C web test:browser:cross
      - name: Run Firefox and WebKit component contracts
        run: pnpm -C web test:browser:contract:cross

  browser-periodic:
    name: Chromium periodic browser contracts (Linux)
    runs-on: ubuntu-latest
    # The Playwright dependency bootstrap may invoke apt on a cold runner; allow
    # transiently slow mirrors without skipping the periodic contract suite.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Install Chromium runtime
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: Run Chromium periodic component contracts
        run: pnpm -C web test:browser:contract:periodic

  windows-browser:
    name: Browser and process smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Install Chromium runtime
        run: pnpm -C web exec playwright install chromium
      - name: Run the Windows browser and process smoke
        run: pnpm -C web test:browser:smoke

  native-output-linux:
    name: Loop-ext4 output certification (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Install latest govulncheck
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          mkdir -p "$GOBIN"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Certify the exact weekly root artifact on loop-ext4
        run: bash scripts/ci/linux/release.sh v0.0.0 "$GITHUB_SHA" linux-ext4

  native-output-windows:
    name: Standard-user NTFS output certification (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Install latest govulncheck
        shell: pwsh
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          New-Item -ItemType Directory -Force -Path $env:GOBIN | Out-Null
          & go install golang.org/x/vuln/cmd/govulncheck@latest
          if ($LASTEXITCODE -ne 0) {
              throw "govulncheck installation exited with code $LASTEXITCODE"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $env:GOBIN -Encoding utf8
      - name: Certify the exact weekly root artifact on NTFS
        shell: pwsh
        run: ./scripts/ci/windows/release.ps1 -Version v0.0.0 -CommitSHA $env:GITHUB_SHA -NativeProfile windows-ntfs
