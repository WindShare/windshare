name: Weekly Product Stability

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 0"

permissions:
  contents: read

# A manual diagnostic rerun supersedes an older run for the same ref without
# coupling any of the independent product suites below.
concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOWORK: "off"

jobs:
  integration-linux:
    name: Integration stability (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Prepare Rust native relay toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Run integration packages
        run: go test -count=1 ./integration/...

  integration-windows:
    name: Integration stability (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Prepare Rust native relay toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Run integration packages
        run: go test -count=1 ./integration/...

  named-go-long:
    name: Named process and catalog long suites (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Prepare Rust native relay toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Run process and relay-cut suites
        run: go test -count=1 ./e2e -run '^TestLong'
      - name: Run catalog scale suites
        run: go test -count=1 ./core/catalog -run '^TestLong'

  durable-output:
    name: Durable output runtime (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Run native durability suites
        run: go test -count=1 ./osfs/internal/output -run '^TestLong'

  durable-output-windows:
    name: Durable output runtime (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Run native durability suites
        run: go test -count=1 ./osfs/internal/output -run '^TestLong'

  browser-progressive:
    name: Progressive catalog browser scenario (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Prepare Rust native relay toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Install Chromium runtime
        uses: ./.github/actions/setup-browser
        with:
          browsers: chromium
      - name: Run progressive catalog paging
        run: pnpm -C web test:browser:progressive

  browser-network:
    name: Direct and parallel TURN routes (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Prepare Rust native relay toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Install Chromium runtime
        uses: ./.github/actions/setup-browser
        with:
          browsers: chromium
      - name: Run direct and parallel TURN routes
        run: pnpm -C web test:browser:network
      - name: Preserve network failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-network-diagnostics
          path: web/test-results/network-routes/

  browser-interop:
    name: D1/D2 browser-Pion interop (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Install Chromium runtime
        uses: ./.github/actions/setup-browser
        with:
          browsers: chromium
      - name: Run D1/D2 Pion interop
        run: pnpm -C web test:browser:interop

  cross-browser:
    name: Firefox and WebKit product routes (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Prepare Rust native relay toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Install Firefox and WebKit runtimes
        uses: ./.github/actions/setup-browser
        with:
          browsers: firefox webkit
      - name: Run cross-browser product scenarios
        run: pnpm -C web test:browser:cross
      - name: Run Firefox and WebKit component contracts
        run: pnpm -C web test:browser:contract:cross
      - name: Preserve cross-browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-cross-diagnostics
          path: web/test-results/cross-browser-smoke/

  windows-browser:
    name: Browser and process smoke (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: go.sum
      - name: Prepare Rust native relay toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Install Chromium runtime
        run: pnpm -C web exec playwright install chromium
      - name: Run the Windows browser and process smoke
        run: pnpm -C web test:browser:smoke

  native-output-linux:
    name: Loop-ext4 output certification (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Prepare Rust native relay toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay-rust -> .target
          cache-bin: false
          cmd-format: rustup run stable {0}
      - name: Prepare standalone Linux relay build
        run: |
          rustup target add --toolchain stable x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Set up cached govulncheck
        uses: ./.github/actions/setup-govulncheck
      - name: Build and probe the native relay container
        run: |
          docker build -f deploy/wsrelay/Dockerfile -t windshare-relay-check .
          docker run --rm windshare-relay-check --help
      - name: Certify the exact weekly root artifact on loop-ext4
        env:
          # Reuse the cached Cargo target directory for test-only relay-native
          # builds; _releaseassets strips CARGO_TARGET_DIR for clean-room packaging.
          CARGO_TARGET_DIR: ${{ github.workspace }}/relay-rust/.target
        run: bash scripts/ci/linux/release.sh v0.0.0 "$GITHUB_SHA" linux-ext4

  native-output-windows:
    name: Standard-user NTFS output certification (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Prepare Rust native relay toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay-rust -> .target
          cache-bin: false
          cmd-format: rustup run stable {0}
      - name: Set up cached govulncheck
        uses: ./.github/actions/setup-govulncheck
      - name: Certify the exact weekly root artifact on NTFS
        shell: pwsh
        env:
          # Reuse the cached Cargo target directory for test-only relay-native
          # builds; _releaseassets strips CARGO_TARGET_DIR for clean-room packaging.
          CARGO_TARGET_DIR: ${{ github.workspace }}\relay-rust\.target
        run: ./scripts/ci/windows/release.ps1 -Version v0.0.0 -CommitSHA $env:GITHUB_SHA -NativeProfile windows-ntfs
