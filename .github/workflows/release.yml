name: Source and Binary Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA to release
        required: true
        type: string
      version:
        description: Root module version (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: "off"

jobs:
  release:
    name: Bind release authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Resolution runs code from the protected default branch, not from the
      # revision requesting promotion.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify release-control contracts
        run: |
          bash scripts/ci/release-ref.tests.sh
          bash scripts/ci/release-workflow.tests.sh
      - id: release
        name: Bind version to a default-branch revision
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
          INPUT_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/ci/release-ref.sh resolve

  console-bundle:
    name: Embedded console bundle consistency
    needs: release
    uses: ./.github/workflows/console-bundle.yml
    with:
      app: all
      ref: ${{ needs.release.outputs.commit_sha }}

  linux-ext4:
    name: Linux ext4 root artifact and restart certification
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      source_sha256: ${{ steps.verify.outputs.source_sha256 }}
    concurrency:
      group: release-linux-${{ needs.release.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean checkout
        env:
          EXPECTED_SHA: ${{ needs.release.outputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Prepare Rust native relay toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install latest govulncheck
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          mkdir -p "$GOBIN"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Verify signed directory for official distribution
        if: vars.OFFICIAL_NETWORK_ENABLED == 'true'
        run: go run ./cmd/network-sign verify
      - id: verify
        name: Verify root artifact and Linux/ext4 semantics
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_COMMIT_SHA: ${{ needs.release.outputs.commit_sha }}
          WINDSHARE_RELEASE_SOURCE_SHA256_FILE: ${{ runner.temp }}/source-bundle.sha256
        run: |
          set -euo pipefail
          bash scripts/ci/linux/release.sh "$RELEASE_VERSION" "$RELEASE_COMMIT_SHA" linux-ext4 verify
          echo "source_sha256=$(cat "$WINDSHARE_RELEASE_SOURCE_SHA256_FILE")" >> "$GITHUB_OUTPUT"

  linux-binaries:
    name: Linux release binaries and baseline relay probe
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-linux-binaries-${{ needs.release.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean checkout
        env:
          EXPECTED_SHA: ${{ needs.release.outputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Prepare Rust native relay toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Prepare standalone Linux relay build
        run: |
          rustup target add --toolchain stable x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools qemu-user
      - name: Package Linux release binaries and verified source bundle
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_COMMIT_SHA: ${{ needs.release.outputs.commit_sha }}
          WINDSHARE_RELEASE_ASSETS: ${{ runner.temp }}/release-assets
        run: bash scripts/ci/linux/release.sh "$RELEASE_VERSION" "$RELEASE_COMMIT_SHA" "" package
      - name: Reopen the packaged relay database on baseline amd64
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: python3 scripts/ci/linux/relay-baseline.py "$RUNNER_TEMP/release-assets" "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  windows-ntfs:
    name: Windows NTFS root artifact and restart certification
    needs: release
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      source_sha256: ${{ steps.verify.outputs.source_sha256 }}
    concurrency:
      group: release-windows-${{ needs.release.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.release.outputs.commit_sha }}
        run: |
          $actualSHA = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSHA -cne $env:EXPECTED_SHA) {
              throw "checkout resolved to $actualSHA instead of $env:EXPECTED_SHA"
          }
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) {
              throw "release checkout is not clean: $($status -join '; ')"
          }
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Prepare Rust native relay toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install latest govulncheck
        shell: pwsh
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          New-Item -ItemType Directory -Force -Path $env:GOBIN | Out-Null
          & go install golang.org/x/vuln/cmd/govulncheck@latest
          if ($LASTEXITCODE -ne 0) {
              throw "govulncheck installation exited with code $LASTEXITCODE"
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $env:GOBIN -Encoding utf8
      - name: Verify native-output helper contract
        shell: pwsh
        run: ./scripts/ci/native-output/windows/certify.tests.ps1
      - id: verify
        name: Verify root artifact and Windows/NTFS semantics
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_COMMIT_SHA: ${{ needs.release.outputs.commit_sha }}
          WINDSHARE_RELEASE_SOURCE_SHA256_FILE: ${{ runner.temp }}/source-bundle.sha256
        run: |
          ./scripts/ci/windows/release.ps1 -Version $env:RELEASE_VERSION -CommitSHA $env:RELEASE_COMMIT_SHA -NativeProfile windows-ntfs -Mode verify
          $digest = (Get-Content -LiteralPath $env:WINDSHARE_RELEASE_SOURCE_SHA256_FILE -Raw).Trim()
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "source_sha256=$digest" -Encoding utf8

  windows-binaries:
    name: Windows release binaries
    needs: release
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: release-windows-binaries-${{ needs.release.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.release.outputs.commit_sha }}
        run: |
          $actualSHA = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSHA -cne $env:EXPECTED_SHA) {
              throw "checkout resolved to $actualSHA instead of $env:EXPECTED_SHA"
          }
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0 -or $status.Count -ne 0) {
              throw "release checkout is not clean: $($status -join '; ')"
          }
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Prepare Rust native relay toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Package Windows release binaries and verified source bundle
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_COMMIT_SHA: ${{ needs.release.outputs.commit_sha }}
          WINDSHARE_RELEASE_ASSETS: ${{ runner.temp }}/release-assets
        run: ./scripts/ci/windows/release.ps1 -Version $env:RELEASE_VERSION -CommitSHA $env:RELEASE_COMMIT_SHA -Mode package
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error

  publish:
    name: Publish immutable tag and verified artifacts
    needs:
      - release
      - console-bundle
      - linux-ext4
      - linux-binaries
      - windows-ntfs
      - windows-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-publish-${{ needs.release.outputs.version }}
      cancel-in-progress: false
    steps:
      # The write token is exposed only to the protected default-branch helper.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: ${{ runner.temp }}/verified-release
      - name: Verify all hosts reconstructed the same source bundle
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          ASSET_ROOT: ${{ runner.temp }}/verified-release
          LINUX_VERIFY_SHA: ${{ needs.linux-ext4.outputs.source_sha256 }}
          WINDOWS_VERIFY_SHA: ${{ needs.windows-ntfs.outputs.source_sha256 }}
        run: |
          set -euo pipefail
          cmp "$ASSET_ROOT/release-linux/windshare-$RELEASE_VERSION-source.zip" \
              "$ASSET_ROOT/release-windows/windshare-$RELEASE_VERSION-source.zip"
          (cd "$ASSET_ROOT/release-linux" && sha256sum -c SHA256SUMS-linux-amd64)
          (cd "$ASSET_ROOT/release-windows" && sha256sum -c SHA256SUMS-windows-amd64)
          packaged_sha="$(sha256sum "$ASSET_ROOT/release-linux/windshare-$RELEASE_VERSION-source.zip" | cut -d ' ' -f 1)"
          test "$packaged_sha" = "$LINUX_VERIFY_SHA"
          test "$packaged_sha" = "$WINDOWS_VERIFY_SHA"
      - name: Read the directory from the certified revision
        if: vars.OFFICIAL_NETWORK_ENABLED == 'true'
        env:
          RELEASE_SHA: ${{ needs.release.outputs.commit_sha }}
        run: git show "$RELEASE_SHA:deploy/network/windshare-network.json" > "$RUNNER_TEMP/verified-release/windshare-network.json"
      - name: Create immutable root release tag
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_COMMIT_SHA: ${{ needs.release.outputs.commit_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/ci/release-ref.sh publish
      - name: Publish source and binary release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          ASSET_ROOT: ${{ runner.temp }}/verified-release
        run: |
          set -euo pipefail
          directory=()
          if [[ -f "$ASSET_ROOT/windshare-network.json" ]]; then
            directory+=("$ASSET_ROOT/windshare-network.json")
          fi
          gh release create "$RELEASE_VERSION" --verify-tag --title "WindShare $RELEASE_VERSION" \
            --notes 'Includes wind and wsrelay binaries, the complete source bundle with pinned Pion dependencies, and SHA-256 checksums. Follow docs/installation.md inside the bundle for installation and optional first setup.' \
            "$ASSET_ROOT/release-linux/windshare-$RELEASE_VERSION-source.zip" \
            "$ASSET_ROOT/release-linux/windshare-$RELEASE_VERSION-linux-amd64.zip" \
            "$ASSET_ROOT/release-windows/windshare-$RELEASE_VERSION-windows-amd64.zip" \
            "$ASSET_ROOT/release-linux/SHA256SUMS-linux-amd64" \
            "$ASSET_ROOT/release-windows/SHA256SUMS-windows-amd64" \
            "${directory[@]}"

  official-network:
    needs: [release, publish]
    if: vars.OFFICIAL_NETWORK_ENABLED == 'true'
    uses: ./.github/workflows/official-network.yml
    permissions:
      contents: read
    with:
      commit_sha: ${{ needs.release.outputs.commit_sha }}
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
