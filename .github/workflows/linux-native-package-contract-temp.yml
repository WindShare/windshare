name: Temporary Linux native package contract

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Native package split on loop-ext4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Verify Linux release contracts
        run: bash scripts/ci/core-release-linux-temp.tests.sh
      - name: Run native tests from their owning packages
        shell: bash
        run: |
          set -euo pipefail
          release_root="$(mktemp -d "$RUNNER_TEMP/windshare-native.XXXXXXXX")"
          cleanup() {
            local status="$?"
            trap - EXIT
            rm -rf -- "$release_root"
            exit "$status"
          }
          trap cleanup EXIT
          bash scripts/ci/core-release-linux-native.sh "$GITHUB_WORKSPACE/core" "$release_root"