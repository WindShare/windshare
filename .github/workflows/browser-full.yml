# Scheduled full validation calls the same cross-OS current-commit DAG as PR and
# release, replacing only the PR Chromium sample with protected browser authority.
name: Full Browser

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  current-commit:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/current-commit.yml
    with:
      browser-authority: full
