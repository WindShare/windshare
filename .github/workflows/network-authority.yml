name: Deploy network authority

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/actions/setup-worker-build/**
      - .github/workflows/console-bundle.yml
      - consoles/network/**
      - consoles/ui/**
      - consoles/build/**
      - consoles/vite.config.mjs
      - consoles/tsconfig.json
      - consoles/package.json
      - consoles/pnpm-lock.yaml
      - relay-rust/Cargo.*
      - relay-rust/rust-toolchain.toml
      - relay-rust/.cargo/**
      - relay-rust/crates/relay-access/**
      - relay-rust/crates/network-authority/**
      - relay-rust/crates/relay-cloudflare/package-lock.json
      - deploy/network/history/**
      - deploy/network/release.json
      - scripts/deploy/network-authority.py
      - scripts/deploy/network_authority_test.py
      - .github/workflows/network-authority.yml
  push:
    branches: [main]
    # PRs exercise the Worker setup action. Linux hygiene runs the helper tests on every push to main.
    paths:
      - .github/workflows/network-authority.yml
      - scripts/deploy/network-authority.py
      - relay-rust/Cargo.*
      - relay-rust/rust-toolchain.toml
      - relay-rust/.cargo/**
      - relay-rust/crates/relay-access/**
      - .github/workflows/console-bundle.yml
      - consoles/network/**
      - consoles/ui/**
      - consoles/build/**
      - consoles/vite.config.mjs
      - consoles/tsconfig.json
      - consoles/package.json
      - consoles/pnpm-lock.yaml
      - relay-rust/crates/network-authority/**
      - relay-rust/crates/relay-cloudflare/package-lock.json
      - deploy/network/history/**
      - deploy/network/release.json

permissions:
  contents: read
concurrency:
  group: ${{ github.event.pull_request.number && format('network-authority-pr-{0}', github.event.pull_request.number) || 'network-authority' }}
  cancel-in-progress: false

jobs:
  console:
    uses: ./.github/workflows/console-bundle.yml
    with:
      app: network
  verify:
    name: Verify authority Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify authority deployment helper
        run: python3 -m unittest scripts/deploy/network_authority_test.py
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay-rust/crates/relay-cloudflare/package-lock.json
      - name: Install Rust Wasm toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay-rust -> .target
          cache-bin: false
          shared-key: network-authority-verify
          cmd-format: rustup run stable {0}
      - uses: ./.github/actions/setup-worker-build
      - name: Install pinned Wrangler
        working-directory: relay-rust/crates/relay-cloudflare
        run: npm ci
      - name: Verify authority Worker boundary flows
        working-directory: relay-rust/crates/network-authority
        run: node tests/run.mjs

  deploy:
    needs: [console, verify]
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.NETWORK_AUTHORITY_ENABLED == 'true')
    environment: network-authority
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay-rust/crates/relay-cloudflare/package-lock.json
      - name: Install Rust Wasm toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay-rust -> .target
          cache-bin: false
          shared-key: network-authority-deploy
          cmd-format: rustup run stable {0}
      - uses: ./.github/actions/setup-worker-build
      - name: Install pinned Wrangler
        working-directory: relay-rust/crates/relay-cloudflare
        run: npm ci
      - name: Deploy certified generation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTHORITY_WORKER_NAME: ${{ vars.AUTHORITY_WORKER_NAME }}
          AUTHORITY_API_HOST: ${{ vars.AUTHORITY_API_HOST }}
          AUTHORITY_ORIGIN_HOST: ${{ vars.AUTHORITY_ORIGIN_HOST }}
          AUTHORITY_ZONE: ${{ vars.AUTHORITY_ZONE }}
          AUTHORITY_ALLOWED_ORIGINS: ${{ vars.AUTHORITY_ALLOWED_ORIGINS }}
          AUTHORITY_TRUSTED_PROXY_IPS: ${{ vars.AUTHORITY_TRUSTED_PROXY_IPS }}
          DIRECTORY_KV_ID: ${{ vars.DIRECTORY_KV_ID }}
          DIRECTORY_CERTIFICATE: ${{ vars.DIRECTORY_CERTIFICATE }}
          DIRECTORY_SIGNING_SEED: ${{ secrets.DIRECTORY_SIGNING_SEED }}
          AUTHORITY_TRUST: ${{ vars.AUTHORITY_TRUST }}
          EMAIL_WEBHOOK_URL: ${{ vars.EMAIL_WEBHOOK_URL }}
          EMAIL_WEBHOOK_TOKEN: ${{ secrets.EMAIL_WEBHOOK_TOKEN }}
          EXTRA_EMAIL_DOMAINS: ${{ vars.EXTRA_EMAIL_DOMAINS }}
          AUTHORITY_SIGNING_SEED: ${{ secrets.AUTHORITY_SIGNING_SEED }}
          INITIALIZATION_TOKEN: ${{ secrets.INITIALIZATION_TOKEN }}
          PASSWORD_PEPPER: ${{ secrets.PASSWORD_PEPPER }}
        run: |
          python scripts/deploy/network-authority.py --network-release deploy/network/release.json
          echo 'Network authority deployed. Sign in at the configured API host under `/console`.' >> "$GITHUB_STEP_SUMMARY"
