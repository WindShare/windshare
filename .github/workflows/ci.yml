# Pull requests invoke the same reusable cross-OS authority DAG as full and
# release validation, selecting only the fast Windows Chromium sample.
name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "core/v*"
      - "core-candidate/v*/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  current-commit:
    # Reusable-workflow calls must advertise the maximum permission any
    # conditionally reachable child job may request. current-commit.yml still
    # narrows ordinary jobs to contents: read and grants this capability only
    # to the protected broker when full mode is selected.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/current-commit.yml
    with:
      browser-authority: pr
