# CI parity with the local validation contract (docs/.orchestration/work-plan.md §10).
# Every job mirrors a local gate command; the exact command-to-job mapping is
# recorded in docs/.orchestration/E1.md. Both Go modules are validated
# independently (`./...` does not cross the nested core/ module boundary), each
# with vet, build, race tests, and a go-test-coverage gate driven by the
# module's .testcoverage.yml (core total >=90%, root total >=80%, every
# package >=70%; the ubuntu profile is authoritative). Ubuntu jobs
# natively provide the GOOS=linux compile/type-check path of §10.2 and all
# real-socket coverage; the hosted Windows jobs run GOOS=windows vet plus both
# modules' race tests, isolating the NTFS-heavy core workload on its own runner.
# OS-network test cases are gated at shared constructors
# (internal/testnetwork): open on Linux, skip on Windows outside the local D5
# runner, keeping the hosted Windows job deterministic. Firewall prompts and
# host-owned state are outside every test verdict and are never queried here.
name: CI

permissions:
  contents: read

on:
  push:
    # Core candidate and final tags have a dedicated two-OS release-verification
    # workflow. Branches and every other tag, including root v* tags, retain CI.
    # Branches are explicit because GitHub suppresses branch pushes whenever a
    # workflow declares tag filters without a branch filter.
    branches:
      - "**"
    tags-ignore:
      - "core/v*"
      - "core-candidate/v*/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

env:
  # Pinned coverage-gate tool; thresholds live in each module's .testcoverage.yml.
  GO_TEST_COVERAGE: github.com/vladopajic/go-test-coverage/v2@v2.18.8
  # Native identity recovery can exceed Go's ten-minute package default under
  # race or coverage instrumentation; this is a ceiling, not a runtime target.
  CORE_SUITE_TEST_TIMEOUT: 30m
  # Both browser jobs share logical identity but materialize their own
  # current-machine resolution lock on their independent hosted runners.
  BROWSER_EVIDENCE_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  hygiene:
    name: Hygiene (gofmt, whitespace, v1 forbidden, R8 evidence, gopls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: gofmt over tracked Go files
        run: |
          unformatted="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      # Local §10.1 runs `git diff --check` against the dirty worktree; on a
      # clean checkout the equivalent is diffing the committed tree against the
      # empty tree so every tracked file is inspected.
      - name: whitespace errors over the committed tree
        run: git diff --check "$(git hash-object -t tree /dev/null)"
      - name: CI checkout contract
        run: |
          node scripts/ci/contract.tests.mjs
          node scripts/ci/contract.mjs
      - name: Web v1 forbidden references (source-only)
        run: node scripts/ci/web-forbidden.mjs --source-only
      - name: Go v1 forbidden roots and production dependencies
        run: node scripts/ci/go-v1-forbidden.mjs
      - name: R8 performance evidence contracts
        shell: pwsh
        run: |
          ./scripts/go-benchmark-evidence.tests.ps1
          ./scripts/r8-go-evidence.tests.ps1
          ./scripts/r8-evidence-summary.tests.ps1
      - name: gopls check (severity=hint, tracked files)
        run: |
          gopls_version="$(tr -d '\r\n' < scripts/ci/gopls.version)"
          if [[ ! "$gopls_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "gopls.version is not a canonical release version: $gopls_version" >&2
            exit 1
          fi
          go install "golang.org/x/tools/gopls@$gopls_version"
          gopls_bin="$(go env GOPATH)/bin/gopls"
          set -o pipefail
          git ls-files -z -- '*.go' | xargs -0 "$gopls_bin" check -severity=hint | tee gopls-diagnostics.txt
          if [ -s gopls-diagnostics.txt ]; then
            echo "gopls reported diagnostics" >&2
            exit 1
          fi

  sloc:
    name: SLOC guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: sloc-guard check
        # Tracks the latest sloc-guard release so new gate features (e.g. rule
        # additions the config relies on) apply without a CI bump.
        uses: doraemonkeys/sloc-guard/.github/action@master

  lint:
    name: Lint (actionlint + golangci-lint, both Go modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      # The canonical gate validates every workflow first, then installs the
      # pinned host Go linter and analyzes both modules for both OS source sets.
      - name: actionlint + golangci-lint (all workflows and both Go modules)
        run: bash scripts/ci/lint.sh

  go-root:
    name: Go root module (vet, build, race, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: go test with coverage
        run: go test -count=1 ./... -covermode=atomic -coverprofile=cover.out
      - name: coverage gate (total >=80%, package >=70%)
        run: go run "$GO_TEST_COVERAGE" --config=.testcoverage.yml --profile=cover.out

  go-core:
    name: Go core module (vet, build, race, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test -race
        run: go test -race -count=1 -timeout="$CORE_SUITE_TEST_TIMEOUT" ./...
      - name: go test with coverage
        run: go test -count=1 -timeout="$CORE_SUITE_TEST_TIMEOUT" ./... -covermode=atomic -coverprofile=cover.out
      - name: coverage gate (total >=90%, package >=70%)
        run: go run "$GO_TEST_COVERAGE" --config=.testcoverage.yml --profile=cover.out

  golden-vectors:
    name: Golden-vector idempotence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      # Mirrors §10.3: regenerate every generated vector family twice; the regenerations
      # must be byte-identical and must match the committed files exactly.
      - name: regenerate twice and compare hashes
        run: bash scripts/ci/vectors.sh

  core-release:
    name: Core module synthetic artifact and Linux/ext4 certification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # This reserved version makes ordinary validation ineligible as release evidence.
      CORE_ARTIFACT_VERSION: "v0.0.0-ci"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache: false
      # The extracted artifact has no parent repository or go.work, so package
      # tests cannot accidentally consume files outside the published module.
      # The native profile is explicit here so workflow review cannot weaken the
      # non-skippable ext4 certification by changing host detection.
      - name: build and validate deterministic core module artifact
        run: bash scripts/ci/core-release.sh "$CORE_ARTIFACT_VERSION" "$GITHUB_SHA" linux-ext4

  gowork-off-root:
    name: GOWORK=off root build
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      # The dedicated core-tag workflow owns the core-first cut. Every event
      # reaching ordinary CI must prove the root consumes a published core
      # version without a workspace or replace directive.
      - name: root module GOWORK=off build
        run: go build ./...

  web:
    name: Web (frozen install, lint, typecheck, build, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # pnpm only (project constraint); the version comes from the
      # packageManager field in web/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: forced typecheck
        run: pnpm exec tsc -b --force
      - name: build
        run: pnpm build
      - name: v1 forbidden production graph and bundle
        run: pnpm forbidden
      - name: vitest remainder (browser contracts have one dedicated owner)
        run: pnpm run test:unit:remainder

  browser-contract:
    name: Browser contract (schema, reducer, guard, workflow)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        timeout-minutes: 5
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        timeout-minutes: 10
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install contract dependencies
        timeout-minutes: 10
        run: pnpm -C web install --frozen-lockfile --ignore-scripts
      - name: run browser contract exactly once
        timeout-minutes: 10
        run: pnpm -C web run test:browser:evidence:contract

  # The hostile-environment verifier is a real process boundary, so it remains
  # independent of both contract discovery and the browser evidence artifact DAG.
  browser-generated-semantic-process:
    name: Browser generated-semantic process isolation (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        timeout-minutes: 5
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        timeout-minutes: 10
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install generated-semantic process dependencies
        timeout-minutes: 10
        run: pnpm -C web install --frozen-lockfile --ignore-scripts
      - name: verify generated-semantic process isolation
        timeout-minutes: 10
        run: pnpm -C web run test:browser:generated-semantic:process

  browser-main:
    name: Browser main (focused samples + exclusive remainder)
    needs: browser-contract
    runs-on: ubuntu-latest
    timeout-minutes: 130
    outputs:
      sealed_upload_path: ${{ steps.guard.outputs.sealed_upload_path }}
      guard_outcome: ${{ steps.guard.outputs.guard_outcome }}
      manifest_sha256: ${{ steps.guard.outputs.manifest_sha256 }}
      manifest_byte_length: ${{ steps.guard.outputs.manifest_byte_length }}
      settlement_invocation_id: ${{ steps.producer.outputs.settlement_invocation_id }}
      settlement_runtime_manifest_sha256: ${{ steps.producer.outputs.settlement_runtime_manifest_sha256 }}
      settlement_public_key_spki_base64: ${{ steps.producer.outputs.settlement_public_key_spki_base64 }}
      settlement_public_key_sha256: ${{ steps.producer.outputs.settlement_public_key_sha256 }}
    env:
      BROWSER_EVIDENCE_ROOT: ${{ github.workspace }}/test-results/browser-evidence/main
      BROWSER_EVIDENCE_CONTEXT: ${{ github.workspace }}/test-results/browser-evidence/main/context.json
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        timeout-minutes: 10
        with:
          go-version-file: go.work
      - uses: pnpm/action-setup@v6
        timeout-minutes: 5
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        timeout-minutes: 10
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install browser runtime once
        timeout-minutes: 28
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web exec playwright install --with-deps chromium firefox webkit
          pnpm -C web run test:browser:preflight
      - name: build and preflight main native runtime once
        id: runtime
        timeout-minutes: 13
        run: >-
          node scripts/ci/browsergate/main.mjs build-runtime
          --output-parent "${{ github.workspace }}/test-results/browser-runtime/main"
          --suite main
          --run-id "$BROWSER_EVIDENCE_RUN_ID"
          --checkout-sha "${{ github.sha }}"
          --run-policy blocking
          --github-output "$GITHUB_OUTPUT"
      - name: produce main samples and exclusive remainder
        id: producer
        timeout-minutes: 35
        run: >-
          node scripts/ci/browsergate/main.mjs hosted-produce
          --output-root "$BROWSER_EVIDENCE_ROOT"
          --context "$BROWSER_EVIDENCE_CONTEXT"
          --run-id "$BROWSER_EVIDENCE_RUN_ID"
          --checkout-sha "${{ github.sha }}"
          --run-policy blocking
          --suite main
          --runtime-manifest "${{ steps.runtime.outputs.runtime_manifest_path }}"
          --runtime-manifest-sha256 "${{ steps.runtime.outputs.runtime_manifest_sha256 }}"
          --github-output "$GITHUB_OUTPUT"
      - name: guard and seal the main upload directory
        id: guard
        if: always()
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/browsergate/main.mjs guard-suite
          --context "$BROWSER_EVIDENCE_CONTEXT"
          --suite main
          --secret-env GITHUB_TOKEN
          --runtime-manifest "${{ steps.runtime.outputs.runtime_manifest_path }}"
          --runtime-manifest-sha256 "${{ steps.runtime.outputs.runtime_manifest_sha256 }}"
          --settlement-invocation-id "${{ steps.producer.outputs.settlement_invocation_id }}"
          --settlement-runtime-manifest-sha256 "${{ steps.producer.outputs.settlement_runtime_manifest_sha256 }}"
          --settlement-public-key-spki-base64 "${{ steps.producer.outputs.settlement_public_key_spki_base64 }}"
          --settlement-public-key-sha256 "${{ steps.producer.outputs.settlement_public_key_sha256 }}"
          --github-output "$GITHUB_OUTPUT"
      - name: upload the single sealed main directory
        timeout-minutes: 5
        if: always() && steps.guard.outputs.guard_outcome == 'passed'
        uses: actions/upload-artifact@v7
        with:
          name: browser-main-guarded
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: ${{ steps.guard.outputs.sealed_upload_path }}
      - name: dispose authenticated main native runtime
        timeout-minutes: 5
        if: >-
          always() &&
          steps.runtime.outputs.runtime_manifest_path != '' &&
          steps.runtime.outputs.runtime_manifest_sha256 != ''
        run: >-
          node scripts/ci/browsergate/main.mjs dispose-runtime
          --runtime-manifest "${{ steps.runtime.outputs.runtime_manifest_path }}"
          --runtime-manifest-sha256 "${{ steps.runtime.outputs.runtime_manifest_sha256 }}"
          --suite main
          --run-id "$BROWSER_EVIDENCE_RUN_ID"
          --checkout-sha "${{ github.sha }}"
          --run-policy blocking

  browser-pion:
    name: Browser Pion (focused samples + exclusive remainder)
    needs: browser-contract
    runs-on: ubuntu-latest
    timeout-minutes: 130
    outputs:
      sealed_upload_path: ${{ steps.guard.outputs.sealed_upload_path }}
      guard_outcome: ${{ steps.guard.outputs.guard_outcome }}
      manifest_sha256: ${{ steps.guard.outputs.manifest_sha256 }}
      manifest_byte_length: ${{ steps.guard.outputs.manifest_byte_length }}
      settlement_invocation_id: ${{ steps.producer.outputs.settlement_invocation_id }}
      settlement_runtime_manifest_sha256: ${{ steps.producer.outputs.settlement_runtime_manifest_sha256 }}
      settlement_public_key_spki_base64: ${{ steps.producer.outputs.settlement_public_key_spki_base64 }}
      settlement_public_key_sha256: ${{ steps.producer.outputs.settlement_public_key_sha256 }}
    env:
      BROWSER_EVIDENCE_ROOT: ${{ github.workspace }}/test-results/browser-evidence/pion
      BROWSER_EVIDENCE_CONTEXT: ${{ github.workspace }}/test-results/browser-evidence/pion/context.json
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        timeout-minutes: 10
        with:
          go-version-file: go.work
      - uses: pnpm/action-setup@v6
        timeout-minutes: 5
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        timeout-minutes: 10
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install browser runtime once
        timeout-minutes: 28
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web exec playwright install --with-deps chromium firefox webkit
          pnpm -C web run test:browser:preflight
      - name: build and preflight Pion native runtime once
        id: runtime
        timeout-minutes: 13
        run: >-
          node scripts/ci/browsergate/main.mjs build-runtime
          --output-parent "${{ github.workspace }}/test-results/browser-runtime/pion"
          --suite pion
          --run-id "$BROWSER_EVIDENCE_RUN_ID"
          --checkout-sha "${{ github.sha }}"
          --run-policy blocking
          --github-output "$GITHUB_OUTPUT"
      - name: produce Pion samples and exclusive remainder
        id: producer
        timeout-minutes: 35
        run: >-
          node scripts/ci/browsergate/main.mjs hosted-produce
          --output-root "$BROWSER_EVIDENCE_ROOT"
          --context "$BROWSER_EVIDENCE_CONTEXT"
          --run-id "$BROWSER_EVIDENCE_RUN_ID"
          --checkout-sha "${{ github.sha }}"
          --run-policy blocking
          --suite pion
          --runtime-manifest "${{ steps.runtime.outputs.runtime_manifest_path }}"
          --runtime-manifest-sha256 "${{ steps.runtime.outputs.runtime_manifest_sha256 }}"
          --github-output "$GITHUB_OUTPUT"
      - name: guard and seal the Pion upload directory
        id: guard
        if: always()
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci/browsergate/main.mjs guard-suite
          --context "$BROWSER_EVIDENCE_CONTEXT"
          --suite pion
          --secret-env GITHUB_TOKEN
          --runtime-manifest "${{ steps.runtime.outputs.runtime_manifest_path }}"
          --runtime-manifest-sha256 "${{ steps.runtime.outputs.runtime_manifest_sha256 }}"
          --settlement-invocation-id "${{ steps.producer.outputs.settlement_invocation_id }}"
          --settlement-runtime-manifest-sha256 "${{ steps.producer.outputs.settlement_runtime_manifest_sha256 }}"
          --settlement-public-key-spki-base64 "${{ steps.producer.outputs.settlement_public_key_spki_base64 }}"
          --settlement-public-key-sha256 "${{ steps.producer.outputs.settlement_public_key_sha256 }}"
          --github-output "$GITHUB_OUTPUT"
      - name: upload the single sealed Pion directory
        timeout-minutes: 5
        if: always() && steps.guard.outputs.guard_outcome == 'passed'
        uses: actions/upload-artifact@v7
        with:
          name: browser-pion-guarded
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: ${{ steps.guard.outputs.sealed_upload_path }}
      - name: dispose authenticated Pion native runtime
        timeout-minutes: 5
        if: >-
          always() &&
          steps.runtime.outputs.runtime_manifest_path != '' &&
          steps.runtime.outputs.runtime_manifest_sha256 != ''
        run: >-
          node scripts/ci/browsergate/main.mjs dispose-runtime
          --runtime-manifest "${{ steps.runtime.outputs.runtime_manifest_path }}"
          --runtime-manifest-sha256 "${{ steps.runtime.outputs.runtime_manifest_sha256 }}"
          --suite pion
          --run-id "$BROWSER_EVIDENCE_RUN_ID"
          --checkout-sha "${{ github.sha }}"
          --run-policy blocking

  browser-verdict:
    name: Browser verdict (standard-library reducer)
    needs:
      - browser-main
      - browser-pion
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          persist-credentials: false
      - name: download sealed main evidence
        id: download_main
        timeout-minutes: 2
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: browser-main-guarded
          path: browser-verdict-inputs/main
      - name: download sealed Pion evidence
        id: download_pion
        timeout-minutes: 2
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: browser-pion-guarded
          path: browser-verdict-inputs/pion
      - name: reduce sealed browser evidence
        id: verdict
        timeout-minutes: 3
        if: always()
        run: >-
          node scripts/ci/browsergate/verdict.mjs
          --run-id "$BROWSER_EVIDENCE_RUN_ID"
          --checkout-sha "${{ github.sha }}"
          --main-root browser-verdict-inputs/main
          --pion-root browser-verdict-inputs/pion
          --suite-job-outcome main=${{ needs.browser-main.result }}
          --suite-job-outcome pion=${{ needs.browser-pion.result }}
          --guard-outcome main=${{ needs.browser-main.outputs.guard_outcome }}
          --guard-outcome pion=${{ needs.browser-pion.outputs.guard_outcome }}
          --manifest-sha256 main=${{ needs.browser-main.outputs.manifest_sha256 }}
          --manifest-sha256 pion=${{ needs.browser-pion.outputs.manifest_sha256 }}
          --manifest-byte-length main=${{ needs.browser-main.outputs.manifest_byte_length }}
          --manifest-byte-length pion=${{ needs.browser-pion.outputs.manifest_byte_length }}
          --download-outcome main=${{ steps.download_main.outcome }}
          --download-outcome pion=${{ steps.download_pion.outcome }}
          --output test-results/browser-verdict/verdict.json

  windows-tests:
    name: Windows tests (vet + race, OS-network cases gated)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      # Windows-tagged files are otherwise only compiled, never vet-analyzed:
      # ubuntu jobs vet GOOS=linux and the test steps below do not run vet
      # (E1-review.md finding LOW-1).
      - name: go vet (root, GOOS=windows)
        run: go vet ./...
      - name: go vet (core, GOOS=windows)
        run: go vet ./...
        working-directory: core
      # OS-network cases self-gate at the shared socket/process constructors
      # (internal\testnetwork): skip on Windows outside the local D5 runner, so
      # these sweeps cannot hang on real-socket cases. The local D5 fixed-path
      # runner covers those Windows cases; firewall prompts and host-owned state
      # are outside its verdict. Real-socket CI coverage lives in the ubuntu jobs.
      - name: root Windows race tests (OS-network cases gated)
        run: go test -race -count=1 ./...
      - name: ordinary core Windows race tests
        run: ./scripts/ci/race.ps1 -CoreWorkload ordinary -SkipRoot

  # outputruntime performs many real NTFS durability operations. Its test-level
  # parallelism is useful only when it cannot contend with catalog on one hosted
  # virtual disk, so this runner boundary preserves both workloads' throughput.
  windows-output-runtime:
    name: Windows output runtime race (isolated NTFS workload)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
      - name: NTFS-heavy output runtime race tests
        run: ./scripts/ci/race.ps1 -CoreWorkload output-runtime -SkipRoot

  # Ordinary cross-platform tests inject deterministic process backends. This
  # hosted boundary keeps generated-semantic isolation, the real Node named-pipe
  # client, and the Go Job-object authority from drifting behind those doubles.
  windows-browser-process:
    name: Windows browser process isolation (generated semantic + Job Object)
    runs-on: windows-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        timeout-minutes: 10
        with:
          go-version-file: go.work
      - uses: pnpm/action-setup@v6
        timeout-minutes: 5
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        timeout-minutes: 10
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install Windows browser runner dependencies
        timeout-minutes: 15
        run: pnpm -C web install --frozen-lockfile
      - name: exercise generated-semantic and Windows process boundaries
        timeout-minutes: 30
        run: |
          pnpm -C web run test:browser:process
          go test ./web/scripts/browser-evidence/windowsjob
