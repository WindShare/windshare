name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer run for the same branch or pull request makes the older result stale,
# while unrelated refs keep all seven validation lanes available in parallel.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            go.sum
            core/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      # Resolve @latest on every run so a new upstream release immediately owns
      # a new cache key. Installation uses the resolved versions to prevent a
      # release published between resolution and compilation from poisoning it.
      - name: Resolve current Go validation tools
        id: go-validation-tools
        env:
          GOWORK: "off"
          TOOL_SPECS_FILE: ${{ runner.temp }}/go-validation-tools.txt
        run: |
          set -o pipefail
          modules=(
            github.com/rhysd/actionlint
            github.com/golangci/golangci-lint/v2
            golang.org/x/tools/gopls
          )
          go list -m -f '{{.Path}} {{.Version}}' "${modules[@]/%/@latest}" |
            while read -r module version; do
              case "$module" in
                github.com/rhysd/actionlint)
                  package="$module/cmd/actionlint"
                  ;;
                github.com/golangci/golangci-lint/v2)
                  package="$module/cmd/golangci-lint"
                  ;;
                golang.org/x/tools/gopls)
                  package="$module"
                  ;;
                *)
                  echo "unexpected validation tool module: $module" >&2
                  exit 1
                  ;;
              esac
              printf '%s@%s\n' "$package" "$version"
            done | sort | tee "$TOOL_SPECS_FILE"
          fingerprint="$(sha256sum "$TOOL_SPECS_FILE" | cut -d ' ' -f 1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      # Exact-only restoration is intentional: a prefix fallback could execute
      # a stale analyzer after @latest resolves to a newer upstream release.
      - name: Restore current Go validation tools
        id: go-validation-tools-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/go-tools
          key: go-validation-tools-v1-${{ runner.os }}-${{ runner.arch }}-go${{ steps.setup-go.outputs.go-version }}-${{ steps.go-validation-tools.outputs.fingerprint }}
      - name: Install current Go validation tools
        if: steps.go-validation-tools-cache.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/go-tools
          GOWORK: "off"
          TOOL_SPECS_FILE: ${{ runner.temp }}/go-validation-tools.txt
        run: |
          mkdir -p "$GOBIN"
          mapfile -t tools < "$TOOL_SPECS_FILE"
          pids=()
          for tool in "${tools[@]}"; do
            go install "$tool" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done
      - name: Expose current Go validation tools
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          for tool in actionlint golangci-lint gopls; do
            test -x "$GOBIN/$tool"
          done
          echo "$GOBIN" >> "$GITHUB_PATH"
      # Save immediately after a cold install so a newly released analyzer is
      # reusable even when its new diagnostics correctly fail a later gate.
      - name: Save current Go validation tools
        if: steps.go-validation-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/go-tools
          key: ${{ steps.go-validation-tools-cache.outputs.cache-primary-key }}
      - name: Verify formatting and repository hygiene
        run: make hygiene
      - name: Enforce source size boundaries
        uses: doraemonkeys/sloc-guard/.github/action@master
        with:
          version: latest
      - name: Lint workflow structure
        run: make workflow-lint
      - name: Lint Go source
        run: make lint
      - name: Check Go language-server diagnostics
        run: make gopls

  go-root:
    name: Root Go module
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            go.sum
            core/go.sum
      - name: Install current coverage checker
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          mkdir -p "$GOBIN"
          go install github.com/vladopajic/go-test-coverage/v2@latest
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Vet the root module
        run: go vet ./...
      # Disabling the workspace exercises the released-core dependency graph;
      # the ordinary workspace build is already performed by the test sweep.
      - name: Build the released-core consumer
        run: make root-release-graph
      - name: Run root short race and atomic coverage once
        run: >-
          go test -short -race -count=1 -covermode=atomic
          -coverprofile="$RUNNER_TEMP/root.cover.out" ./...
      - name: Enforce root and package coverage floors
        run: >-
          go-test-coverage --config=.testcoverage.yml
          --profile="$RUNNER_TEMP/root.cover.out"

  go-core:
    name: Core Go module and protocol vectors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: core/go.sum
      - name: Install current coverage checker
        env:
          GOBIN: ${{ runner.temp }}/go-tools
        run: |
          mkdir -p "$GOBIN"
          go install github.com/vladopajic/go-test-coverage/v2@latest
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Vet the core module
        run: go -C core vet ./...
      - name: Build the independent core module
        env:
          GOWORK: "off"
        run: go -C core build ./...
      - name: Run core short race and atomic coverage once
        run: >-
          go -C core test -short -race -count=1 -covermode=atomic
          -coverprofile="$RUNNER_TEMP/core.cover.out" ./...
      - name: Enforce core and package coverage floors
        working-directory: core
        run: >-
          go-test-coverage --config=.testcoverage.yml
          --profile="$RUNNER_TEMP/core.cover.out"
      - name: Verify protocol vectors once
        run: make vectors

  web:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen Web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Lint, build, and test the Web application once
        run: make web

  go-e2e:
    name: Critical Go process path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            go.sum
            core/go.sum
      - name: Run the critical sender, relay, and receiver path once
        run: make e2e

  browser-chromium:
    name: Chromium relay smoke and short browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            go.sum
            core/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frozen Web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Install the Chromium runtime
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: Run Chromium relay smoke and short browser contracts once
        run: make browser

  windows-native:
    name: Native Windows build, vet, and short tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            go.sum
            core/go.sum
      - name: Vet the native Windows source set
        run: make vet
      # Windows build tags make this an independent check of the same published
      # module boundary rather than a duplicate of the Linux root build.
      - name: Build the released-core consumer
        run: make root-release-graph
      # The measured Windows race path exceeded the six-minute workflow goal;
      # Linux owns race/coverage while this lane keeps Windows-native behavior.
      - name: Run root short tests once
        run: go test -short -count=1 ./...
      - name: Run core short tests once
        run: go -C core test -short -count=1 ./...
