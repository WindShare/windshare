# Pull requests invoke the same reusable cross-OS authority DAG as full and
# release validation, selecting only the fast Windows Chromium sample.
name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "core/v*"
      - "core-candidate/v*/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

jobs:
  current-commit:
    permissions:
      contents: read
    uses: ./.github/workflows/current-commit.yml
    with:
      browser-authority: pr
