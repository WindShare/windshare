name: Temporary Linux output-platform contract

on:
  workflow_dispatch:
  push:
    branches:
      - codex/linux-output-platform-tests

permissions:
  contents: read

jobs:
  outputlinux:
    name: outputlinux package coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Run Linux output package tests with coverage
        run: go test -count=1 -timeout=10m ./osfs/internal/outputlinux -covermode=atomic -coverprofile=outputlinux.cover.out
      - name: Print package coverage
        run: go tool cover -func=outputlinux.cover.out | tail -n 1
