name: Deploy private relay

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/console-bundle.yml
      - .github/workflows/cloudflare-relay.yml
      - consoles/relay/**
      - consoles/ui/**
      - consoles/build/**
      - consoles/vite.config.mjs
      - consoles/tsconfig.json
      - consoles/package.json
      - consoles/pnpm-lock.yaml
      - scripts/deploy/cloudflare/**
      - relay-rust/Cargo.*
      - relay-rust/rust-toolchain.toml
      - relay-rust/.cargo/**
      - relay-rust/console/**
      - relay-rust/crates/relay-core/**
      - relay-rust/crates/relay-access/**
      - relay-rust/crates/relay-cloudflare/**
      - relay-rust/tests/_goclient/**
      - engine/relaysetup/**
      - engine/turnissuer/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-relay.yml
      - scripts/deploy/cloudflare/**
      - deploy/network/**
      - relay-rust/Cargo.*
      - relay-rust/rust-toolchain.toml
      - relay-rust/.cargo/**
      - .github/workflows/console-bundle.yml
      - consoles/relay/**
      - consoles/ui/**
      - consoles/build/**
      - consoles/vite.config.mjs
      - consoles/tsconfig.json
      - consoles/package.json
      - consoles/pnpm-lock.yaml
      - relay-rust/console/**
      - relay-rust/crates/relay-core/**
      - relay-rust/crates/relay-access/**
      - relay-rust/crates/relay-cloudflare/**
      - web/src/**
      - web/public/**
      - web/index.html
      - web/package.json
      - web/pnpm-lock.yaml
      - web/tsconfig*.json
      - web/vite.config.ts

permissions:
  contents: read

# Do not interrupt an upload between publishing code and verifying retained state.
# Manual and default-branch deployments share one queue.
concurrency:
  group: ${{ github.event.pull_request.number && format('cloudflare-relay-pr-{0}', github.event.pull_request.number) || 'cloudflare-relay' }}
  cancel-in-progress: false

jobs:
  console:
    uses: ./.github/workflows/console-bundle.yml
    with:
      app: relay
  verify:
    name: Verify private relay Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: relay-rust/crates/relay-cloudflare/package-lock.json
      - name: Check deployment lifecycle
        run: node --test scripts/deploy/cloudflare/*.test.mjs
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Rust Wasm toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay-rust -> .target
          cache-bin: false
          cmd-format: rustup run stable {0}
      - name: Install Worker builder
        run: cargo +stable install worker-build --version 0.8.7 --locked
      - name: Install pinned Wrangler
        working-directory: relay-rust/crates/relay-cloudflare
        run: npm ci
      - name: Check local access and managed TURN lifecycle
        working-directory: relay-rust/crates/relay-cloudflare
        run: npm run test:access
  deploy:
    needs: [console, verify]
    if: >-
      vars.CLOUDFLARE_RELAY_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_TURN_ENABLED: ${{ vars.CLOUDFLARE_TURN_ENABLED }}
      CLOUDFLARE_DEPLOYMENT_MODE: ${{ vars.CLOUDFLARE_DEPLOYMENT_MODE || 'full' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: relay-rust/crates/relay-cloudflare/package-lock.json
      - name: Validate deployment inputs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_RELAY_DOMAIN: ${{ secrets.CLOUDFLARE_RELAY_DOMAIN }}
          CLOUDFLARE_FRONTEND_DOMAIN: ${{ secrets.CLOUDFLARE_FRONTEND_DOMAIN }}
          CLOUDFLARE_FRONTEND_SAAS_HOST: ${{ secrets.CLOUDFLARE_FRONTEND_SAAS_HOST }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          WINDSHARE_OWNER_PASSWORD: ${{ secrets.WINDSHARE_OWNER_PASSWORD }}
          CLOUDFLARE_CONSOLE_DOMAIN: ${{ secrets.CLOUDFLARE_CONSOLE_DOMAIN }}
        run: |
          node --input-type=module -e "
            import { readDeploymentMode } from './scripts/deploy/cloudflare/configuration.mjs';
            import { readInputs } from './scripts/deploy/cloudflare/deployment.mjs';
            import { readFrontendInputs } from './scripts/deploy/cloudflare/frontend.mjs';
            const mode = readDeploymentMode(process.env);
            (mode === 'frontend' ? readFrontendInputs : readInputs)(process.env);
          "
      - uses: pnpm/action-setup@v6
        if: env.CLOUDFLARE_DEPLOYMENT_MODE != 'relay-only'
        with:
          version: latest
      - name: Install frozen Web dependencies
        if: env.CLOUDFLARE_DEPLOYMENT_MODE != 'relay-only'
        run: pnpm -C web install --frozen-lockfile
      - name: Install Rust Wasm toolchain
        if: env.CLOUDFLARE_DEPLOYMENT_MODE != 'frontend'
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Install Worker builder
        if: env.CLOUDFLARE_DEPLOYMENT_MODE != 'frontend'
        run: |
          cargo +stable install worker-build --version 0.8.7 --locked
      - name: Install pinned Wrangler
        working-directory: relay-rust/crates/relay-cloudflare
        run: npm ci
      - name: Deploy selected service mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_RELAY_DOMAIN: ${{ secrets.CLOUDFLARE_RELAY_DOMAIN }}
          CLOUDFLARE_FRONTEND_DOMAIN: ${{ secrets.CLOUDFLARE_FRONTEND_DOMAIN }}
          CLOUDFLARE_FRONTEND_SAAS_HOST: ${{ secrets.CLOUDFLARE_FRONTEND_SAAS_HOST }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          WINDSHARE_OWNER_PASSWORD: ${{ secrets.WINDSHARE_OWNER_PASSWORD }}
          CLOUDFLARE_CONSOLE_DOMAIN: ${{ secrets.CLOUDFLARE_CONSOLE_DOMAIN }}
          RUSTUP_TOOLCHAIN: stable
        run: node scripts/deploy/cloudflare/run.mjs
