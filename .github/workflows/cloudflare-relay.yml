# Forks use repository Actions settings so credentials and mode switches share one scope.
# Manual dispatch deploys from the default branch. CLOUDFLARE_RELAY_ENABLED opts into
# automatic updates. Upstream leaves it unset to verify Go-only pushes to main.
name: Deploy private relay

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Go contract and CI tooling changes have their own verification workflow.
    paths:
      - .github/workflows/cloudflare-relay.yml
      - scripts/deploy/cloudflare/**
      - '!scripts/deploy/cloudflare/**/*.test.mjs'
      - '!scripts/deploy/cloudflare/smoke.mjs'
      - deploy/network/**
      - '!deploy/network/**/*.md'
      - relay-rust/Cargo.*
      - relay-rust/rust-toolchain.toml
      - relay-rust/.cargo/**
      - consoles/relay/**
      - consoles/ui/**
      - consoles/build/**
      - '!consoles/build/**/*.test.mjs'
      - consoles/vite.config.mjs
      - consoles/tsconfig.json
      - consoles/package.json
      - consoles/pnpm-lock.yaml
      - relay-rust/console/**
      - relay-rust/crates/relay-core/**
      - relay-rust/crates/relay-access/**
      - relay-rust/crates/relay-cloudflare/**
      - '!relay-rust/**/tests/**'
      - '!relay-rust/**/*_tests.rs'
      - '!relay-rust/**/*.md'
      - web/build/**
      - web/src/**
      - web/public/**
      - web/index.html
      - web/package.json
      - web/pnpm-lock.yaml
      - web/tsconfig*.json
      - web/vite.config.ts

permissions:
  contents: read

# Keep manual and automatic uploads serialized through post-deploy verification.
concurrency:
  group: cloudflare-relay
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_RELAY_ENABLED == 'true') &&
      vars.CLOUDFLARE_DEPLOYMENT_MODE != 'frontend'
    uses: ./.github/workflows/cloudflare-relay-verify.yml
    with:
      caller_managed: true

  deploy:
    needs: verify
    if: >-
      !cancelled() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_RELAY_ENABLED == 'true') &&
      (
        (vars.CLOUDFLARE_DEPLOYMENT_MODE == 'frontend' && needs.verify.result == 'skipped') ||
        (vars.CLOUDFLARE_DEPLOYMENT_MODE != 'frontend' && needs.verify.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
      CLOUDFLARE_TURN_ENABLED: ${{ vars.CLOUDFLARE_TURN_ENABLED }}
      CLOUDFLARE_DEPLOYMENT_MODE: ${{ vars.CLOUDFLARE_DEPLOYMENT_MODE || 'full' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay-rust/crates/relay-cloudflare/package-lock.json
      - name: Validate deployment inputs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_RELAY_DOMAIN: ${{ secrets.CLOUDFLARE_RELAY_DOMAIN }}
          CLOUDFLARE_FRONTEND_DOMAIN: ${{ secrets.CLOUDFLARE_FRONTEND_DOMAIN }}
          CLOUDFLARE_FRONTEND_SAAS_HOST: ${{ secrets.CLOUDFLARE_FRONTEND_SAAS_HOST }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          WINDSHARE_OWNER_PASSWORD: ${{ secrets.WINDSHARE_OWNER_PASSWORD }}
          CLOUDFLARE_CONSOLE_DOMAIN: ${{ secrets.CLOUDFLARE_CONSOLE_DOMAIN }}
        run: |
          node --input-type=module -e "
            import { readDeploymentMode } from './scripts/deploy/cloudflare/configuration.mjs';
            import { readInputs } from './scripts/deploy/cloudflare/deployment.mjs';
            import { readFrontendInputs } from './scripts/deploy/cloudflare/frontend.mjs';
            const mode = readDeploymentMode(process.env);
            (mode === 'frontend' ? readFrontendInputs : readInputs)(process.env);
          "
      - uses: pnpm/action-setup@v6
        if: env.CLOUDFLARE_DEPLOYMENT_MODE != 'relay-only'
        with:
          version: latest
      - name: Install frozen Web dependencies
        if: env.CLOUDFLARE_DEPLOYMENT_MODE != 'relay-only'
        run: pnpm -C web install --frozen-lockfile
      - name: Install Rust Wasm toolchain
        if: env.CLOUDFLARE_DEPLOYMENT_MODE != 'frontend'
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: env.CLOUDFLARE_DEPLOYMENT_MODE != 'frontend'
        with:
          workspaces: relay-rust -> .target
          cache-bin: false
          shared-key: relay-cloudflare-wasm
          save-if: false
          cmd-format: rustup run stable {0}
      - uses: ./.github/actions/setup-worker-build
        if: env.CLOUDFLARE_DEPLOYMENT_MODE != 'frontend'
      - name: Install pinned Wrangler
        working-directory: relay-rust/crates/relay-cloudflare
        run: npm ci
      - name: Deploy selected service mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_RELAY_DOMAIN: ${{ secrets.CLOUDFLARE_RELAY_DOMAIN }}
          CLOUDFLARE_FRONTEND_DOMAIN: ${{ secrets.CLOUDFLARE_FRONTEND_DOMAIN }}
          CLOUDFLARE_FRONTEND_SAAS_HOST: ${{ secrets.CLOUDFLARE_FRONTEND_SAAS_HOST }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          WINDSHARE_OWNER_PASSWORD: ${{ secrets.WINDSHARE_OWNER_PASSWORD }}
          CLOUDFLARE_CONSOLE_DOMAIN: ${{ secrets.CLOUDFLARE_CONSOLE_DOMAIN }}
        run: node scripts/deploy/cloudflare/run.mjs
