name: Deploy WindShare to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-relay.yml
      - scripts/deploy/cloudflare/**
      - relay-rust/**
      - web/src/**
      - web/public/**
      - web/index.html
      - web/package.json
      - web/pnpm-lock.yaml
      - web/tsconfig*.json
      - web/vite.config.ts

permissions:
  contents: read

# Do not interrupt an upload between publishing code and verifying retained state.
# All runs for this repository serialize, including manual runs.
concurrency:
  group: cloudflare-relay
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.CLOUDFLARE_RELAY_ENABLED == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_DEPLOYMENT_MODE: ${{ vars.CLOUDFLARE_DEPLOYMENT_MODE || 'full' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: relay-rust/crates/relay-cloudflare/package-lock.json
      - name: Check deployment lifecycle
        run: node --test scripts/deploy/cloudflare/*.test.mjs
      - name: Validate deployment mode
        run: node --input-type=module -e "import { readDeploymentMode } from './scripts/deploy/cloudflare/configuration.mjs'; readDeploymentMode(process.env);"
      - uses: pnpm/action-setup@v6
        if: env.CLOUDFLARE_DEPLOYMENT_MODE == 'full'
        with:
          version: latest
      - name: Install frozen Web dependencies
        if: env.CLOUDFLARE_DEPLOYMENT_MODE == 'full'
        run: pnpm -C web install --frozen-lockfile
      - name: Install Rust Wasm toolchain
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Install Worker builder and configuration encryption
        run: |
          cargo +stable install worker-build --version 0.8.7 --locked
          sudo apt-get update
          sudo apt-get install --yes age
      - name: Install pinned Wrangler
        working-directory: relay-rust/crates/relay-cloudflare
        run: npm ci
      - name: Deploy and verify retained identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_RELAY_DOMAIN: ${{ vars.CLOUDFLARE_RELAY_DOMAIN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          WINDSHARE_CONFIG_RECIPIENT: ${{ vars.WINDSHARE_CONFIG_RECIPIENT }}
          WINDSHARE_DEPLOYMENT_OUTPUT: ${{ runner.temp }}/windshare-relay-config
          RUSTUP_TOOLCHAIN: stable
        run: node scripts/deploy/cloudflare/run.mjs
      - name: Publish encrypted import configuration
        uses: actions/upload-artifact@v4
        with:
          name: windshare-relay-config
          path: |
            ${{ runner.temp }}/windshare-relay-config/relay.json.age
            ${{ runner.temp }}/windshare-relay-config/deployment.json
          if-no-files-found: error
          retention-days: 30
