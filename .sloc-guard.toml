# sloc-guard configuration file
# See: https://github.com/doraemonkeys/sloc-guard for documentation
version = "2"

# Optional: inherit from presets or remote configs
# extends = "preset:rust-strict"
# extends = "https://example.com/shared-config.toml"

# =============================================================================
# Scanner: How to discover files
# =============================================================================
[scanner]
gitignore = true                          # Respect .gitignore (default: true)
exclude = [
  ".git/**",
  "**/node_modules/**",
  "**/dist/**",
  "trash/**",
  # Exact upstream source projection is separately hash/patch verified in hygiene.
  # WindShare provider wrappers and tests remain under normal source limits.
  "third_party/pion/ice/**",
  "third_party/pion/webrtc/**",
]

# =============================================================================
# Content: SLOC (Source Lines of Code) limits
# =============================================================================
[content]
# File types to analyze (Go backend + React/TS web frontend)
extensions = ["go", "ts", "tsx", "js", "jsx"]
max_lines = 600                           # Default max lines per file (Go and other sources)
warn_threshold = 0.9                      # Warn at 90% of limit
skip_comments = true                      # Don't count comment lines
skip_blank = true                         # Don't count blank lines
# Pinned Unicode tables grow with the dataset, not handwritten logic. Hygiene
# verifies the Go projection from the TS tables; Unicode contract tests cover
# behavior. Keep the algorithms and directory counts under normal limits.
exclude = [
  "core/internal/unicode15/normalization_data_generated.go",
  "core/internal/unicode15/casefold_data_generated.go",
  "web/src/unicode/unicode-normalization-data.ts",
  "web/src/unicode/unicode-case-fold-data.ts",
]

# Content Rules: Override limits for specific paths (last match wins)
[[content.rules]]
pattern = "**/*.ts"
max_lines = 700
reason = "TypeScript sources get modest headroom over the Go default"

[[content.rules]]
pattern = "**/*.tsx"
max_lines = 800
reason = "React components carry JSX markup overhead"

[[content.rules]]
pattern = "**/*_test.go"
max_lines = 1100
reason = "Go tests need room for table-driven cases and fixtures"

[[content.rules]]
pattern = "**/*.{test,spec}.{js,jsx,mjs,cjs,ts,tsx}"
max_lines = 1200
reason = "JavaScript and TypeScript tests need room for fixtures and golden vectors"

[[content.rules]]
pattern = "web/test/**"
max_lines = 1200
reason = "Shared test fixtures and golden vectors"

# =============================================================================
# Structure: Directory organization limits
# =============================================================================
# No global max_files/max_dirs: structure limits apply only where the rules
# below match, so directories outside the selected roots stay unconstrained.
[structure]
warn_threshold = 0.8                      # Warn at 80% of limits (inherited by rules)
# Test suites grow by scenario rather than module responsibility, so they do not
# indicate production-module sprawl. Content limits above still apply.
count_exclude = [
  "*_test.go",
  "*.{test,spec}.{js,jsx,mjs,cjs,ts,tsx}",
  "go.mod",
  "go.sum",
]

# A trailing slash includes each selected source root and its whole subtree.
# Keeping connectivity and internal runtime packages in scope prevents test
# infrastructure from escaping the same module boundaries as product code.
[[structure.rules]]
scope = "{cmd,connectivity,core,internal,relay,transport}/"
max_files = 20
max_dirs = 25
warn_dirs_at = 20
warn_files_at = 15
reason = "Go source: keep packages small and flat"

# E2E fixtures include reusable process/service infrastructure, so their modules
# retain the same file-count limit as production code and validation scripts.
[[structure.rules]]
scope = "web/{e2e,scripts,src}/"
max_files = 20
max_dirs = 25
warn_dirs_at = 20
warn_files_at = 15
reason = "Web source and reusable test infrastructure: keep modules small and flat"

# Scenario-local fixtures, harnesses, and probes grow with test coverage. Their
# directory file count does not measure module sprawl; content limits still apply.
[[structure.rules]]
scope = "web/test/"
max_dirs = 25
warn_dirs_at = 20
reason = "Web test scenarios: keep directory navigation manageable without a file-count cap"

# Vector data grows with contract coverage; any source files added here still
# need normal module limits. make vectors verifies the inventory and contracts.
[[structure.rules]]
scope = "core/testvectors/"
max_files = 20
max_dirs = 25
warn_files_at = 15
warn_dirs_at = 20
count_exclude = ["*.json", "README.md", "inventory.txt"]
reason = "Protocol vector data and documentation do not count toward module size"

# =============================================================================
# Baseline: Grandfather existing violations
# =============================================================================
[baseline]
# ratchet = "warn"                        # warn|auto|strict - enforce violations can only decrease

# =============================================================================
# Trend: History tracking settings
# =============================================================================
[trend]
max_entries = 100                         # Keep last 100 snapshots
max_age_days = 90                         # Delete entries older than 90 days
min_interval_secs = 3600                  # At most one entry per hour
# min_code_delta = 10                     # Ignore changes < 10 lines

# =============================================================================
# Custom Languages: Define comment syntax for unsupported languages
# =============================================================================
