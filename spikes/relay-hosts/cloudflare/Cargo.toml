[package]
name = "windshare-cloudflare-close-probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "=0.8.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
base64 = "0.23.1"
windshare-relay-core = { path = "../../../relay-rust/crates/relay-core" }

[profile.release]
opt-level = "s"
lto = true
# wasm-bindgen needs symbol metadata to generate exception wrappers.
strip = "debuginfo"
