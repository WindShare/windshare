[package]
name = "windshare-native-host-probe"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
default-run = "windshare-native-host-probe"

[features]
cloud-client = ["dep:rustls", "tokio-tungstenite/rustls-tls-webpki-roots"]

[[bin]]
name = "cloudflare-slow-peer"
path = "src/cloudflare_slow_peer.rs"
required-features = ["cloud-client"]

[workspace]

[dependencies]
windshare-relay-core = { path = "../../../relay-rust/crates/relay-core" }
base64 = "0.23.1"
serde_json = "1"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3", features = ["sink"] }
socket2 = "0.6"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
