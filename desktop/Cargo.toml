[workspace]
members = ["crates/windshare-ui", "crates/windshare-desktop"]
default-members = ["crates/windshare-desktop"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Reserve must_use for obligation types; annotating every value-returning
# getter would add noise without catching a realistic mistake.
must_use_candidate = "allow"
cognitive_complexity = "deny"
too_many_lines = "deny"

[workspace.dependencies]
# Match the exact upstream snapshot used by gpui-kit, without its component layer.
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
anyhow = "1"
dirs = "5.0.1"
sys-locale = "0.3.2"
tempfile = "3.27.0"
unicode-segmentation = "1.12"
usvg = { version = "0.46", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windshare-ui = { path = "crates/windshare-ui" }

[profile.dev]
debug = 0
incremental = true
