[package]
name = "windshare-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
resvg = { version = "0.46", default-features = false }

[lints]
workspace = true

[dependencies]
windshare-activation = { path = "../windshare-activation" }
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader",
  "Win32_Globalization", "Win32_UI_Shell",
] }
