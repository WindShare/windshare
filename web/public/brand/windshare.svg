<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="26.713 11.755 468.811 468.811" fill="none" role="img" aria-labelledby="windshare-logo-title windshare-logo-description">
  <title id="windshare-logo-title">WindShare · 小风精灵</title>
  <desc id="windshare-logo-description">A smiling little wind spirit with a soft mint-green body, a cream face, a curled forelock, and a flowing breeze tail. Outlined in deep forest green on a transparent background.</desc>

