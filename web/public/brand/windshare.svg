       C105 267 128 263 145 247
       C120 208 146 160 190 156
       C187 116 217 85 256 91
       C277 60 321 58 348 85
       C368 105 373 131 364 153
       C413 159 449 196 449 243
       C470 274 460 314 432 336
       C431 378 394 410 351 401
       C327 431 285 434 258 411
       C228 424 198 410 187 382Z"
    fill="#9CE8C4" stroke="#173F35" stroke-width="13" stroke-linejoin="round"
  />

